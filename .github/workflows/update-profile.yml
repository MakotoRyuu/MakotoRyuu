name: Update profile calendar

on:
  schedule:
    # 00:17 in Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: '17 16 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate calendar
        run: python scripts/update_profile.py
      - name: Commit changed image
        run: |
          git add assets/profile-calendar.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile calendar'
          git push
