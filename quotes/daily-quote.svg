<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 816 64" role="img" aria-labelledby="title">
<title id="title">星星之火，可以燎原。 —— 毛主席</title>
<style>@font-face{font-family:QuoteHandwriting;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:QuoteHandwriting,"PingFang SC","Microsoft YaHei",sans-serif;}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="40" y="18" width="3" height="28" rx="1.5" fill="#1f883d"/>
<text x="62" y="40" font-size="22.00" fill="#24292f">星星之火，可以燎原。</text>
<text x="776" y="40" text-anchor="end" font-size="22" fill="#57606a">—— 毛主席</text>
</svg>
